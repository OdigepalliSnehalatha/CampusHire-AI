server.port=8080

# Application configuration
spring.application.name=CampusHire-AI

# Default in-memory H2 database for smooth local development (auto creates tables and loads seed data)
# To switch to MySQL, start MySQL service and activate the 'mysql' profile: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:campushiredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
app.jwt.secret=9a3b8e7c1d5f2a4b8c6e0d3f7a9b1c5e8d2f4a6b0c3e7a9b1c5d8f2a4b6e0c3d
app.jwt.expiration-ms=86400000

# AI Configuration
# Leave blank to use built-in intelligent demo mode ("AI Demo Mode"), or provide Gemini/OpenAI API key
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.openai.api-key=${OPENAI_API_KEY:}

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
